<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>🌲 Outdoor Quest Web Client</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#228B22">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Outdoor Quest">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            padding-left: calc(16px + env(safe-area-inset-left, 0px));
            padding-right: calc(16px + env(safe-area-inset-right, 0px));
            max-width: 720px;
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        h1, h2, h3 {
            color: #89b4fa;
        }
        h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            margin-top: 8px;
            text-align: center;
        }
        .panel {
            background-color: #313244;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #45475a;
        }
        input, button {
            font-size: 16px; /* Prevents auto-zoom on mobile */
            padding: 12px 14px;
            margin: 4px 0;
            border-radius: 8px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            touch-action: manipulation;
        }
        input {
            width: 100%;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            cursor: pointer;
            font-weight: bold;
            min-height: 44px;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }
        button:hover {
            background-color: #b4befe;
        }
        #log {
            background-color: #11111b;
            padding: 12px;
            height: 140px;
            overflow-y: scroll;
            font-family: monospace;
            font-size: 0.88rem;
            border-radius: 8px;
            margin-top: 10px;
        }
        .log-entry {
            margin: 2px 0;
            border-bottom: 1px solid #313244;
            padding-bottom: 2px;
        }
        .error { color: #f38ba8; }
        .success { color: #a6e3a1; }
        .info { color: #89b4fa; }
        .state {
            background-color: #11111b;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.88rem;
            max-height: 250px;
            overflow-y: auto;
        }

        /* Mobile specific enhancements */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .panel {
                padding: 14px;
            }
            .server-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .server-controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>🌲 Outdoor Quest Web Frontend</h1>
    
    <div class="panel">
        <h2>Connection</h2>
        <div class="server-controls" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="wsUrl" value="ws://localhost:8080/ws" style="flex: 1 1 200px; min-width: 0;">
            <button onclick="connect()">Connect</button>
            <button onclick="setWsUrl('ws://localhost:8080/ws')" style="background-color: #45475a; color: #cdd6f4;">Local (8080)</button>
            <button onclick="setWsUrl('wss://hacktober-fest-week-2-7n52.onrender.com/ws')" style="background-color: #45475a; color: #cdd6f4;">Cloud (Render)</button>
            <span id="connStatus" style="color: #f38ba8; font-weight: bold;">Disconnected</span>
        </div>
        <p style="font-size: 0.85em; color: #a6adc8; margin-top: 6px;">
            Make sure your server is running (e.g. <code>cargo run</code> on port 8080 or select Cloud).
        </p>
    </div>

    <div class="panel">
        <h2>Join / Create</h2>
        <div id="actionAlert" style="display: none; padding: 8px 12px; margin-bottom: 10px; border-radius: 4px; background-color: #f38ba8; color: #11111b; font-weight: bold;"></div>
        <div style="margin-bottom: 10px;">
            <input type="text" id="playerName" placeholder="Player Name" onkeydown="if(event.key==='Enter') createGame()">
            <button onclick="createGame()">Create Game</button>
        </div>
        <div>
            <input type="text" id="roomCode" placeholder="Room Code (e.g. QUEST-1234)" onkeydown="if(event.key==='Enter') joinGame()">
            <button onclick="joinGame()">Join Game</button>
        </div>
    </div>

    <div class="panel">
        <h2>Game Actions</h2>
        <p>Your Player ID: <span id="myPlayerId">None</span></p>
        <button onclick="startGame()">Start Game (Host Only)</button>
        <br>
        <input type="text" id="proofInput" placeholder="Photo proof URL or description">
        <button onclick="completeTask()">Complete Current Task</button>
    </div>

    <div class="panel">
        <h2>Game Log</h2>
        <div id="log"></div>
    </div>

    <div class="panel">
        <h2>Current Game State (JSON)</h2>
        <div id="gameState" class="state">Waiting for state...</div>
    </div>

    <script>
        let ws = null;
        let currentPlayerId = null;
        let currentRoomCode = null;

        function setWsUrl(url) {
            document.getElementById('wsUrl').value = url;
            connect();
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('actionAlert');
            if (alertBox) {
                alertBox.textContent = msg;
                alertBox.style.display = 'block';
                setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
            }
        }

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStateDisplay(state) {
            document.getElementById('gameState').textContent = JSON.stringify(state, null, 2);
            if (state && state.room_code) {
                currentRoomCode = state.room_code;
                document.getElementById('roomCode').value = currentRoomCode;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            if (ws) {
                try { ws.close(); } catch (e) {}
            }
            log(`Connecting to ${url}...`, 'info');
            document.getElementById('connStatus').textContent = 'Connecting...';
            document.getElementById('connStatus').style.color = '#f9e2af';

            try {
                ws = new WebSocket(url);
            } catch (err) {
                document.getElementById('connStatus').textContent = 'Failed to Connect';
                document.getElementById('connStatus').style.color = '#f38ba8';
                log(`Failed to open connection: ${err}`, 'error');
                return;
            }
            
            ws.onopen = () => {
                document.getElementById('connStatus').textContent = 'Connected';
                document.getElementById('connStatus').style.color = '#a6e3a1';
                log('Connected to WebSocket server', 'success');
            };

            ws.onclose = () => {
                document.getElementById('connStatus').textContent = 'Disconnected';
                document.getElementById('connStatus').style.color = '#f38ba8';
                log('Disconnected from server', 'error');
                ws = null;
            };

            ws.onerror = (err) => {
                document.getElementById('connStatus').textContent = 'Connection Error';
                document.getElementById('connStatus').style.color = '#f38ba8';
                log('WebSocket Error - make sure server is running', 'error');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                switch (data.type) {
                    case 'GameCreated':
                        currentPlayerId = data.payload.player_id;
                        document.getElementById('myPlayerId').textContent = currentPlayerId;
                        log(`Game created. Room Code: ${data.payload.room_code}`, 'success');
                        updateStateDisplay(data.payload.state);
                        break;
                    
                    case 'GameJoined':
                        currentPlayerId = data.payload.player_id;
                        document.getElementById('myPlayerId').textContent = currentPlayerId;
                        log(`Joined room ${data.payload.room_code} successfully`, 'success');
                        updateStateDisplay(data.payload.state);
                        break;
                    
                    case 'StateUpdate':
                        log(data.payload.log_message, 'info');
                        updateStateDisplay(data.payload.state);
                        break;
                        
                    case 'Error':
                        log(`Error: ${data.payload.message}`, 'error');
                        showAlert(`Server Error: ${data.payload.message}`);
                        break;
                        
                    default:
                        log(`Unknown message: ${event.data}`, 'error');
                }
            };
        }

        function sendMsg(type, payload) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                const msg = 'Not connected to server. Please click Connect above.';
                log(msg, 'error');
                showAlert(msg);
                connect();
                return false;
            }
            ws.send(JSON.stringify({ type, payload }));
            return true;
        }

        function createGame() {
            const nameInput = document.getElementById('playerName');
            const playerName = (nameInput.value || '').trim();
            if (!playerName) {
                showAlert('⚠️ Please enter a Player Name before creating a game!');
                nameInput.focus();
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showAlert('⏳ Connecting to server... Please wait a moment and try again.');
                connect();
                return;
            }
            sendMsg('CreateGame', { player_name: playerName });
        }

        function joinGame() {
            const nameInput = document.getElementById('playerName');
            const playerName = (nameInput.value || '').trim();
            const roomInput = document.getElementById('roomCode');
            const roomCode = (roomInput.value || '').trim();

            if (!playerName) {
                showAlert('⚠️ Please enter a Player Name before joining a game!');
                nameInput.focus();
                return;
            }
            if (!roomCode) {
                showAlert('⚠️ Please enter a Room Code (e.g. QUEST-1234)!');
                roomInput.focus();
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showAlert('⏳ Connecting to server... Please wait a moment and try again.');
                connect();
                return;
            }
            sendMsg('JoinGame', { room_code: roomCode, player_name: playerName });
        }

        function startGame() {
            if (!currentRoomCode || !currentPlayerId) {
                log('Join or create a game first', 'error');
                return;
            }
            sendMsg('StartGame', { 
                room_code: currentRoomCode, 
                player_id: currentPlayerId 
            });
        }

        function completeTask() {
            if (!currentRoomCode || !currentPlayerId) {
                log('Join or create a game first', 'error');
                return;
            }
            let proof = (document.getElementById('proofInput').value || '').trim();
            if (!proof) {
                showAlert('⚠️ Please enter photo proof URL or description before completing task!');
                return;
            }
            
            sendMsg('CompleteTask', { 
                room_code: currentRoomCode, 
                player_id: currentPlayerId,
                proof: proof
            });
            document.getElementById('proofInput').value = '';
        }

        // Auto-connect on load
        window.addEventListener('load', () => {
            connect();
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
